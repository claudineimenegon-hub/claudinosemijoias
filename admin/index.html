<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#1a1610">
  <title>Acesso administrativo | Claudino Semijoias</title>
  <link rel="stylesheet" href="/admin/styles.css">
  <script src="/assets/js/runtime-config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/assets/js/supabase-data.js"></script>
  <script defer src="/admin/app.js"></script>
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div><strong>Claudino Semijoias</strong><span>Acesso administrativo</span></div>
      <a href="/">Ver loja</a>
    </header>

    <section id="loginView" class="card auth-card">
      <h1>Área do lojista</h1>
      <p>Entre com o e-mail e a senha cadastrados no Supabase.</p>
      <form id="loginForm">
        <label>E-mail<input id="email" type="email" autocomplete="username" required></label>
        <label>Senha<input id="password" type="password" autocomplete="current-password" required></label>
        <button type="submit">Entrar no painel completo</button>
      </form>
      <div id="loginStatus" class="status" aria-live="polite"></div>
    </section>
  </main>
</body>
</html>
